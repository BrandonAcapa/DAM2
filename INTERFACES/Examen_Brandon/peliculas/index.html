<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peliculas</title>
</head>
<body>
    <h1 style="text-align: center;">Gestión de Películas</h1>
    <hr>

    <h2>Películas por Género</h2>
    <div id="peliculas"></div>
    <hr>

    <h3>Insertar Nueva Película</h3>
    <input type="number" id="insertarId" placeholder="ID">
    <input type="text" id="insertarNombre" placeholder="Nombre">
    <input type="text" id="insertarDirector" placeholder="Director">
    <input type="text" id="insertarClasificacion" placeholder="Clasificación">
    <button id="insertar">Insertar</button>
    <hr>

    <h3>Modificar Película</h3>
    <input type="number" id="modificarId" placeholder="ID">
    <input type="text" id="modificarNombre" placeholder="Nuevo Nombre">
    <input type="text" id="modificarDirector" placeholder="Nuevo Director">
    <input type="text" id="modificarClasificacion" placeholder="Nueva Clasificación">
    <button id="modificar">Modificar</button>
    <hr>

    <h3>Borrar Película</h3>
    <input type="number" id="borrarPelicula" placeholder="ID">
    <button id="borrar">Borrar</button>

    <script src="app.js"></script>
</body>
</html>
