<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alimentos — CRUD minimal (HTML)</title>
    <meta name="description" content="Interfaz HTML minimal para CRUD de alimentos (solo HTML).">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main>
        <header>
            <h1>Alimentos</h1>
            <p>Información Nutricional</p>
        </header>

        <section class="cards-section">
            <div id="cardsContainer" class="cards-grid">
                <!-- CONTENEDOR DE CARDS -->
            </div>
        </section>

        <section class="add-form-section">
            <div class="form-header">
                <h2 id="form-title"><span id="formModeLabel">CREAR</span> ALIMENTO</h2>
                <label class="switch">
                    <input id="modeSwitch" type="checkbox">
                    <span class="slider"></span>
                </label>
            </div>

            <form id="foodForm">
                <input type="hidden" id="editFoodId" name="editFoodId">

                <div class="edit-controls" style="display:none;">
                    <label for="editSelect">Selecciona alimento</label>
                    <select id="editSelect">
                        <option value="" disabled selected>Selecciona...</option>
                    </select>
                </div>

                <div>
                    <label for="name">Nombre</label>
                    <input id="name" name="name" required placeholder="">
                </div>

                <div>
                    <label for="image">Imagen</label>
                    <input id="image" name="image" type="file" accept="image/*">
                </div>

                <div>
                    <label for="category">Categoría</label>
                    <select id="category" name="category">
                        <option value="Fruta">Fruta</option>
                        <option value="Verdura">Verdura</option>
                        <option value="Pescado">Pescado</option>
                        <option value="Carne">Carne</option>
                        <option value="Lácteo">Lácteo</option>
                        <option value="Otro">Otro</option>
                    </select>
                </div>

                <fieldset>
                    <legend>Valores por unidad (g)</legend>
                    <div>
                        <label for="fat">Grasas (g)</label>
                        <input id="fat" name="fat" type="number" min="0" step="0.1" value="0">
                    </div>
                    <div>
                        <label for="carb">Carbohidratos (g)</label>
                        <input id="carb" name="carb" type="number" min="0" step="0.1" value="0">
                    </div>
                    <div>
                        <label for="protein">Proteínas (g)</label>
                        <input id="protein" name="protein" type="number" min="0" step="0.1" value="0">
                    </div>
                </fieldset>

                <div>
                    <label for="calories">Calorías (kcal) — calculadas</label>
                    <input id="calories" name="calories" readonly placeholder="Calculadas automáticamente">
                </div>

                <div>
                    <button type="submit">Guardar</button>
                    <button type="reset">Limpiar</button>
                </div>
            </form>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
